[package]
name = "naabu-gui"
version = "0.1.0"
edition = "2021"
description = "Random IP generator & port scanner GUI using naabu"

[dependencies]
eframe = { version = "0.31", features = ["default"] }
egui = "0.31"
egui_extras = "0.31"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rfd = "0.15"
tokio = { version = "1", features = ["full"] }
dirs = "6"
