[package]
name = "naabu-web"
version = "0.1.0"
edition = "2021"
description = "Web dashboard for random public IP generation + naabu port scanning"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
tower-http = { version = "0.6", features = ["fs"] }