name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: cargo build (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [cli, web, gui]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }}

      - name: Install system deps (egui / ssl / audio)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libglib2.0-dev \
            libssl-dev \
            libasound2-dev \
            libxcb1-dev \
            libgl1-mesa-dev

      - name: Build
        run: cargo build --manifest-path ${{ matrix.crate }}/Cargo.toml --release

      - name: Test
        run: cargo test --manifest-path ${{ matrix.crate }}/Cargo.toml --release